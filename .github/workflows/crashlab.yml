name: CrashLab

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Unit tests
        run: go test ./...
      - name: Demo stack
        run: docker compose -f demo/compose.yaml up --build -d
      - name: Wait for storefront
        run: |
          for i in $(seq 1 40); do
            if curl -sf http://127.0.0.1:8081/checkout >/dev/null; then
              exit 0
            fi
            sleep 3
          done
          docker compose -f demo/compose.yaml logs
          exit 1
      - name: Reliability smoke test
        run: go run ./cmd/crashlab test --db crashlab.db experiments/ci-smoke.yaml
      - name: Strict latency experiment is expected to fail
        run: go run ./cmd/crashlab test --db crashlab-strict.db --baseline 5s --duration 8s --recovery 5s experiments/payment-latency.yaml
